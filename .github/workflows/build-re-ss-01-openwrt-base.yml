#
# ZWRT JDCloud RE-SS-01 firmware builder — OpenWrt base + ZWRT NSS dirs + kiddin9 feed
#
# Kwrt-style recipe (https://github.com/kiddin9/Kwrt):
#   1. official openwrt/openwrt @ openwrt-25.12 as the base tree
#   2. ZWRT @ 25.12-nss directories transplanted on top
#      (= this repo's checkout at the same commit 6c363ce)
#   3. kiddin9/op-packages appended as an extra feed, LAST so every
#      already-proven package source keeps winning
#
# ZWRT's own feeds.conf.default (immortalwrt packages/luci, NSS feeds, ...)
# replaces the official one because QWRT's 540-package config depends on
# packages the official feeds do not carry (passwall, aria2, fibocom, ...).
# The base *tree* is still pure OpenWrt + the NSS/qualcommax overlay.
#
name: ZWRT RE-SS-01 Builder (Kiddin9)

on:
  workflow_dispatch:
  repository_dispatch:

env:
  TZ: Asia/Shanghai
  CONFIG_FILE: configs/zwrt-re-ss-01.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  OPENWRT_BRANCH: openwrt-25.12
  UPLOAD_BIN_DIR: "false"
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # ubuntu-24.04 keeps the main archive in sources.list.d/ubuntu.sources;
          # deleting the whole directory (as the ubuntu-22.04-era template did)
          # removes the only source and breaks every subsequent apt install.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -E apt-get -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget ccache cmake cpio device-tree-compiler fastjar gperf libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libpython3-dev libreadline-dev libtool lrzsz ninja-build p7zip-full patch pkgconf qemu-utils scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl xmlto xxd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone official OpenWrt
        run: |
          git clone --depth 1 -b $OPENWRT_BRANCH https://github.com/openwrt/openwrt.git openwrt
          echo "base tree:"
          git -C openwrt log -1 --oneline

      - name: Patch download infra for @IMMORTALWRT
        run: |
          set -e
          # The immortalwrt packages/luci feeds reference @IMMORTALWRT, a
          # named mirror only immortalwrt-derived trees know. Official
          # openwrt-25.12's dl_method() filter omits it, so the download
          # rule degenerates to "No download method available" before any
          # network I/O (run 44848001760 died on fibocom-qmi-wwan; the
          # ZWRT main tree carries all three pieces and built it fine).
          # Surgical port of ZWRT's support - three spots, no wholesale
          # file replacement (keeps official 25.12's own changes).
          python3 - <<'PYEOF'
          import json
          # 1) download.mk: recognize @IMMORTALWRT as a default-method URL
          p = 'openwrt/include/download.mk'
          s = open(p).read()
          if '@IMMORTALWRT' not in s:
              old = '@OPENWRT @APACHE/%'
              assert old in s, 'download.mk anchor missing'
              s = s.replace(old, '@OPENWRT @IMMORTALWRT @APACHE/%', 1)
              open(p, 'w').write(s)
              print('patched download.mk')
          else:
              print('download.mk already has @IMMORTALWRT')
          # 2) download.pl: skip the bare token, then load its mirror list
          p = 'openwrt/scripts/download.pl'
          s = open(p).read()
          if '@IMMORTALWRT' not in s:
              anchor = '# use OpenWrt source server directly\n'
              assert anchor in s, 'download.pl elsif anchor missing'
              s = s.replace(
                  anchor,
                  anchor + '\t} elsif ($mirror =~ /^\\@IMMORTALWRT$/) {\n'
                           '\t\t# use ImmortalWrt source server directly\n',
                  1)
              anchor2 = "projectsmirrors '@OPENWRT';\n"
              assert anchor2 in s, 'download.pl projectsmirrors anchor missing'
              s = s.replace(
                  anchor2,
                  "projectsmirrors '@IMMORTALWRT';\n" + anchor2,
                  1)
              open(p, 'w').write(s)
              print('patched download.pl')
          else:
              print('download.pl already has @IMMORTALWRT')
          # 3) projectsmirrors.json: the actual mirror URLs
          p = 'openwrt/scripts/projectsmirrors.json'
          data = json.load(open(p))
          if '@IMMORTALWRT' not in data:
              data['@IMMORTALWRT'] = [
                  'https://mirror2.immortalwrt.org/sources',
                  'https://mirror.immortalwrt.org/sources',
                  'https://sources-cdn.immortalwrt.org',
                  'https://sources.immortalwrt.org',
              ]
              json.dump(data, open(p, 'w'), indent='\t')
              print('patched projectsmirrors.json')
          else:
              print('projectsmirrors.json already has @IMMORTALWRT')
          PYEOF
          grep -n '@IMMORTALWRT' openwrt/include/download.mk openwrt/scripts/download.pl openwrt/scripts/projectsmirrors.json

      - name: Transplant ZWRT NSS directories
        run: |
          set -e
          # Directory-level replacement — same set Kwrt uses, plus the
          # base-tree packages QWRT's config needs (emortal/shellsync/
          # fullconenat-nft) and our Design theme + nssstatus packages.
          # fullcone needs the USERSIDE trio too: firewall4 (renders the
          # fullcone rules + defaults fullcone=1), nftables and libnftnl
          # (parse the `fullcone` expression). Without them the official
          # firewall silently ships fullcone-less and turboacc's status
          # page shows "FullCone NAT: NOT RUNNING" forever.
          # package/kernel/linux MUST come from the ZWRT tree too: its modules/*.mk
          # carry the DEPENDS lines (e.g. ipt-ipopt -> kmod-nf-conntrack)
          # that match the grafted kernel config - official's copies lack
          # them and the kmod dependency check fails packaging (run
          # 44739094508). Same reasoning for qca-nss-dp/qca-ssdk: they must
          # be built against the same NSS kernel tree.
          for d in \
            target/linux/generic \
            target/linux/qualcommax \
            package/boot \
            package/firmware/ipq-wifi \
            package/firmware/ath11k-firmware \
            package/kernel/mac80211 \
            package/kernel/nat46 \
            package/kernel/linux \
            package/kernel/qca-nss-dp \
            package/kernel/qca-ssdk \
            package/emortal \
            package/network/services/shellsync \
            package/network/utils/fullconenat-nft \
            package/network/config/firewall4 \
            package/network/utils/nftables \
            package/libs/libnftnl \
            package/luci-theme-design \
            package/luci-app-nssstatus \
            package/adbyby \
            package/luci-app-wolplus \
            package/luci-app-ramfree \
            package/luci-app-netsteer
          do
            rm -rf "openwrt/$d"
            mkdir -p "openwrt/$(dirname "$d")"
            cp -a "$d" "openwrt/$d"
            echo "grafted: $d"
          done
          # Fail loud if the fullcone USERSIDE trio did not land: without
          # firewall4's fullcone template, nftables' fullcone expression
          # and libnftnl's marshalling, fw4 can never render fullcone
          # rules and turboacc's status page stays NOT RUNNING forever.
          for p in \
            package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch \
            package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch \
            package/libs/libnftnl/patches/001-libnftnl-add-fullcone-expression-support.patch
          do
            [ -f "openwrt/$p" ] || { echo "::error::fullcone patch missing after graft: $p"; exit 1; }
            echo "fullcone patch present: $p"
          done
          # File-level replacements (Kwrt wgets the same three files):
          # image-commands.mk  -> factory/sysupgrade helpers
          # Config.in          -> adds the source line below
          # config/Config-ipq.in -> IPQ memory profile / SKB recycler kernel options
          cp -a include/image-commands.mk openwrt/include/image-commands.mk
          cp -a config/Config-ipq.in openwrt/config/Config-ipq.in
          cp -a Config.in openwrt/Config.in
          echo "grafted: include/image-commands.mk config/Config-ipq.in Config.in"
          grep -n 'Config-ipq' openwrt/Config.in

      - name: Load custom feeds
        run: |
          # Proven ZWRT feed set first (overwrites the official default)…
          cp "$GITHUB_WORKSPACE/feeds.conf.default" "$GITHUB_WORKSPACE/openwrt/feeds.conf.default"
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          # …then kiddin9 LAST: it only fills gaps, never overrides.
          echo 'src-git kiddin9 https://github.com/kiddin9/op-packages.git;main' >> feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a

      - name: Install feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      - name: Resolve mosdns to helloworld (QWRT parity)
        working-directory: openwrt
        run: |
          set -e
          # Same trap as the main line: immortalwrt packages ships
          # mosdns 5.3.3 WITH /etc/init.d/mosdns and sits before
          # helloworld in feeds.conf, so install -a first-wins picked
          # it; sbwml's luci-app-mosdns also owns that file and apk
          # aborts image install with "trying to overwrite" (main run
          # 44847998451, 456/542). QWRT shipped helloworld's mosdns
          # 5.3.4: binary-only, init script belongs to luci-app-mosdns.
          rm -rf package/feeds/packages/mosdns
          ./scripts/feeds install -p helloworld mosdns
          test -f package/feeds/helloworld/mosdns/Makefile
          if grep -q 'init.d' package/feeds/helloworld/mosdns/Makefile; then
            echo "::error::helloworld mosdns unexpectedly ships an init script"
            exit 1
          fi
          echo "mosdns -> $(grep -E '^PKG_(NAME|VERSION)' package/feeds/helloworld/mosdns/Makefile | tr '\n' ' ')"

      - name: Prune kiddin9 duplicates
        run: |
          set -e
          # First-wins across feeds is not guaranteed by scripts/feeds, so
          # remove kiddin9 packages that the base tree or an earlier feed
          # already provides. QWRT-parity sources keep their versions.
          grep -Rh --include=Makefile -E '^PKG_NAME:=' openwrt/package --exclude-dir=feeds 2>/dev/null \
            | sed -E 's/^PKG_NAME:=[[:space:]]*//' | sort -u > /tmp/base_pkg_names
          ls openwrt/package/feeds | grep -v '^kiddin9$' | while read -r fd; do
            ls "openwrt/package/feeds/$fd"
          done | sort -u > /tmp/other_feed_pkg_names
          removed=0
          for f in openwrt/package/feeds/kiddin9/*; do
            [ -e "$f" ] || continue
            n=""
            [ -f "$f/Makefile" ] && n=$(sed -n -E 's/^PKG_NAME:=[[:space:]]*//p' "$f/Makefile" | head -1)
            [ -n "$n" ] || n=$(basename "$f")
            if grep -Fxq "$n" /tmp/base_pkg_names || grep -Fxq "$n" /tmp/other_feed_pkg_names; then
              rm -rf "$f"
              removed=$((removed + 1))
            fi
          done
          echo "kiddin9: pruned $removed duplicate package(s); $(ls openwrt/package/feeds/kiddin9 | wc -l) remain"

      - name: Load custom configuration
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Download package
        id: package
        working-directory: openwrt
        run: |
          # Force a fresh DUMP of the istore packages: a failed DUMP leaves a
          # stub info file (Source-Makefile only, no Package block) behind, and
          # because the Makefile timestamp never changes that stub is reused by
          # every later scan - the package then silently vanishes from Kconfig.
          rm -f tmp/info/.packageinfo-*istore*
          make defconfig
          # Fail fast if the official base silently dropped a symbol the
          # config needs (defconfig discards unknown CONFIG_PACKAGE_* lines).
          missing=""
          for s in \
            CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01 \
            CONFIG_PACKAGE_luci-theme-design \
            CONFIG_PACKAGE_luci-app-ssr-plus \
            CONFIG_PACKAGE_luci-app-nssstatus \
            CONFIG_PACKAGE_luci-app-turboacc \
            CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA \
            CONFIG_PACKAGE_luci-app-store \
            CONFIG_PACKAGE_kmod-tcp-bbr \
            CONFIG_PACKAGE_luci-app-wolplus \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_shellsync \
            CONFIG_PACKAGE_autocore \
            CONFIG_PACKAGE_kmod-nft-fullcone \
            CONFIG_PACKAGE_kmod-qca-nss-ecm \
            CONFIG_PACKAGE_kmod-qca-nss-dp \
            CONFIG_PACKAGE_kmod-usb-net-qmi-wwan-fibocom \
            CONFIG_PACKAGE_wpad-openssl \
            CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_kmod-usb-serial-qualcomm \
            CONFIG_PACKAGE_kmod-usb-serial-sierrawireless \
            CONFIG_PACKAGE_usb-modeswitch \
            CONFIG_PACKAGE_comgt \
            CONFIG_PACKAGE_comgt-ncm \
            CONFIG_PACKAGE_chat \
            CONFIG_PACKAGE_luci-proto-3g \
            CONFIG_PACKAGE_luci-proto-ncm \
            CONFIG_PACKAGE_luci-app-3ginfo-lite \
            CONFIG_PACKAGE_dockerd \
            CONFIG_PACKAGE_luci-app-dockerman \
            CONFIG_PACKAGE_ttyd \
            CONFIG_PACKAGE_luci-app-ttyd \
            CONFIG_PACKAGE_hd-idle \
            CONFIG_PACKAGE_luci-app-hd-idle \
            CONFIG_PACKAGE_adbyby \
            CONFIG_PACKAGE_luci-app-adbyby-plus \
            CONFIG_PACKAGE_luci-i18n-adbyby-plus-zh-cn \
            CONFIG_PACKAGE_clashoo \
            CONFIG_PACKAGE_luci-app-clashoo \
            CONFIG_PACKAGE_luci-app-netsteer \
            CONFIG_PACKAGE_luci-app-ramfree \
            CONFIG_PACKAGE_apk-openssl
          do
            grep -q "^${s}=y" .config || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Config symbols missing after defconfig:$missing"
            echo "=== istore diagnostics ==="
            echo "--- symlink dir ---"
            ls -la package/feeds/istore/ 2>&1 || true
            echo "--- FILELIST entries mentioning istore ---"
            grep -H 'istore' tmp/info/.files-packageinfo-* 2>/dev/null || echo "(istore absent from FILELIST)"
            echo "--- per-package info files ---"
            ls -la tmp/info/.packageinfo-*istore* 2>&1 || true
            for f in tmp/info/.packageinfo-*istore*; do
              if [ -f "$f" ]; then echo "== $f =="; cat "$f"; fi
            done
            echo "--- istore blocks in tmp/.packageinfo ---"
            grep -n -B1 -A15 'luci-app-store' tmp/.packageinfo 2>/dev/null || echo "(luci-app-store absent from tmp/.packageinfo)"
            echo "--- generated Kconfig block ---"
            grep -n -A25 'config PACKAGE_luci-app-store' tmp/.config-package.in 2>/dev/null || echo "(absent from tmp/.config-package.in)"
            echo "--- DUMP errors ---"
            find logs -name 'dump.txt' -path '*istore*' -print -exec cat {} \; 2>/dev/null
            echo "(end istore dump.txt search)"
            exit 1
          fi
          echo "all critical symbols resolved"
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        working-directory: openwrt
        run: |
          echo -e "$(nproc) thread compile"
          free -h
          df -hT
          make -j$(nproc) || make -j1 V=s
          # This batch adds CONFIG_COMPAT so the static armv7 adbyby binary
          # runs on arm64; COMPAT grows the kernel, so assert both that it
          # landed in the kernel .config and that the FIT still fits the
          # 6144k kernel slot (a bigger FIT would push factory rootfs past
          # its pad-to offset and brick the factory layout).
          kcfg=$(find build_dir -maxdepth 6 -name .config -path '*linux-6.12*' | head -1)
          if [ -z "$kcfg" ] || ! grep -q '^CONFIG_COMPAT=y' "$kcfg"; then
            echo "::error::CONFIG_COMPAT not enabled (kcfg=$kcfg)"
            exit 1
          fi
          python3 - <<'PY'
          import struct, glob, sys
          fs = glob.glob('bin/targets/*/*/*factory*.bin')
          if not fs:
              print('::error::no factory image found')
              sys.exit(1)
          for f in fs:
              with open(f, 'rb') as fh:
                  hdr = fh.read(8)
              if hdr[:4] != bytes.fromhex('d00dfeed'):
                  print('::error::%s: not a FIT image' % f)
                  sys.exit(1)
              size = struct.unpack('>I', hdr[4:8])[0]
              print('%s: FIT totalsize=%d (limit 6291456)' % (f, size))
              if size > 6291456:
                  print('::error::kernel FIT %d > 6144k - factory layout would break' % size)
                  sys.exit(1)
          PY
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: |
          df -hT
          free -h
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -20 || true

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/* 2>/dev/null || cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v5
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ZWRT_Kiddin9_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")-owrt" >> $GITHUB_OUTPUT
          touch release.txt
          echo "ZWRT JDCloud RE-SS-01 firmware (Kiddin9 feed)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old Releases
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the 3 newest releases; delete older ones and their tags.
          # gh CLI replaces dev-drprasad/delete-older-releases@master,
          # which runs on node20 and warned on every build.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[3:] | .[] | .tag_name' |
            while read -r tag; do
              [ -n "$tag" ] || continue
              gh release delete "$tag" --yes --cleanup-tag || true
            done
