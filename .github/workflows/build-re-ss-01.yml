#
# ZWRT JDCloud RE-SS-01 firmware builder
# Structure adapted from https://github.com/P3TERX/Actions-OpenWrt (MIT)
#
name: ZWRT RE-SS-01 Builder

on:
  workflow_dispatch:
  repository_dispatch:

env:
  TZ: Asia/Shanghai
  CONFIG_FILE: configs/zwrt-re-ss-01.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: "false"
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # ubuntu-24.04 keeps the main archive in sources.list.d/ubuntu.sources;
          # deleting the whole directory (as the ubuntu-22.04-era template did)
          # removes the only source and breaks every subsequent apt install.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -E apt-get -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget ccache cmake cpio device-tree-compiler fastjar gperf libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libpython3-dev libreadline-dev libtool lrzsz ninja-build p7zip-full patch pkgconf qemu-utils scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl xmlto xxd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Load custom feeds
        run: |
          chmod +x $DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Resolve mosdns to helloworld (QWRT parity)
        run: |
          set -e
          # The immortalwrt packages feed also ships mosdns (5.3.3) and
          # sits BEFORE helloworld in feeds.conf, so install -a's
          # first-wins picked it. Its Makefile installs
          # /etc/init.d/mosdns, colliding with sbwml's luci-app-mosdns
          # 1.7.15 (same file) - apk aborts image install with "trying
          # to overwrite" (run 44847998451, 456/542, the only blocker).
          # QWRT shipped helloworld's mosdns 5.3.4: binary-only, the
          # init script belongs to luci-app-mosdns alone.
          rm -rf package/feeds/packages/mosdns
          ./scripts/feeds install -p helloworld mosdns
          test -f package/feeds/helloworld/mosdns/Makefile
          if grep -q 'init.d' package/feeds/helloworld/mosdns/Makefile; then
            echo "::error::helloworld mosdns unexpectedly ships an init script"
            exit 1
          fi
          echo "mosdns -> $(grep -E '^PKG_(NAME|VERSION)' package/feeds/helloworld/mosdns/Makefile | tr '\n' ' ')"

      - name: Load custom configuration
        run: |
          [ -e files ] && cp -r files files.bak
          cp $CONFIG_FILE .config
          chmod +x $DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          make defconfig
          # Fail fast when defconfig silently drops a critical symbol
          # (unknown CONFIG_PACKAGE_* lines vanish without error - this is
          # how luci-app-wolplus went missing from the image while the
          # config asked for it).
          missing=""
          for s in \
            CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01 \
            CONFIG_PACKAGE_luci-theme-design \
            CONFIG_PACKAGE_luci-app-ssr-plus \
            CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_luci-app-nssstatus \
            CONFIG_PACKAGE_luci-app-turboacc \
            CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA \
            CONFIG_PACKAGE_luci-app-store \
            CONFIG_PACKAGE_kmod-tcp-bbr \
            CONFIG_PACKAGE_luci-app-wolplus \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_shellsync \
            CONFIG_PACKAGE_autocore \
            CONFIG_PACKAGE_kmod-nft-fullcone \
            CONFIG_PACKAGE_kmod-qca-nss-ecm \
            CONFIG_PACKAGE_kmod-qca-nss-dp \
            CONFIG_PACKAGE_kmod-usb-net-qmi-wwan-fibocom \
            CONFIG_PACKAGE_kmod-usb-serial-qualcomm \
            CONFIG_PACKAGE_kmod-usb-serial-sierrawireless \
            CONFIG_PACKAGE_usb-modeswitch \
            CONFIG_PACKAGE_comgt \
            CONFIG_PACKAGE_comgt-ncm \
            CONFIG_PACKAGE_chat \
            CONFIG_PACKAGE_luci-proto-3g \
            CONFIG_PACKAGE_luci-proto-ncm \
            CONFIG_PACKAGE_luci-app-3ginfo-lite \
            CONFIG_PACKAGE_wpad-openssl \
            CONFIG_PACKAGE_apk-openssl \
            CONFIG_PACKAGE_dockerd \
            CONFIG_PACKAGE_luci-app-dockerman \
            CONFIG_PACKAGE_ttyd \
            CONFIG_PACKAGE_luci-app-ttyd \
            CONFIG_PACKAGE_hd-idle \
            CONFIG_PACKAGE_luci-app-hd-idle \
            CONFIG_PACKAGE_adbyby \
            CONFIG_PACKAGE_luci-app-adbyby-plus \
            CONFIG_PACKAGE_luci-i18n-adbyby-plus-zh-cn \
            CONFIG_PACKAGE_clashoo \
            CONFIG_PACKAGE_luci-app-clashoo \
            CONFIG_PACKAGE_luci-app-netsteer \
            CONFIG_PACKAGE_luci-app-ramfree
          do
            grep -q "^${s}=y" .config || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Config symbols missing after defconfig:$missing"
            exit 1
          fi
          echo "all critical symbols resolved"
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          echo -e "$(nproc) thread compile"
          free -h
          df -hT
          make -j$(nproc) || make -j1 V=s
          # This batch adds CONFIG_COMPAT so the static armv7 adbyby binary
          # runs on arm64; COMPAT grows the kernel, so assert both that it
          # landed in the kernel .config and that the FIT still fits the
          # 6144k kernel slot (a bigger FIT would push factory rootfs past
          # its pad-to offset and brick the factory layout).
          kcfg=$(find build_dir -maxdepth 6 -name .config -path '*linux-6.12*' | head -1)
          if [ -z "$kcfg" ] || ! grep -q '^CONFIG_COMPAT=y' "$kcfg"; then
            echo "::error::CONFIG_COMPAT not enabled (kcfg=$kcfg)"
            exit 1
          fi
          python3 - <<'PY'
          import struct, glob, sys
          fs = glob.glob('bin/targets/*/*/*factory*.bin')
          if not fs:
              print('::error::no factory image found')
              sys.exit(1)
          for f in fs:
              with open(f, 'rb') as fh:
                  hdr = fh.read(8)
              if hdr[:4] != bytes.fromhex('d00dfeed'):
                  print('::error::%s: not a FIT image' % f)
                  sys.exit(1)
              size = struct.unpack('>I', hdr[4:8])[0]
              print('%s: FIT totalsize=%d (limit 6291456)' % (f, size))
              if size > 6291456:
                  print('::error::kernel FIT %d > 6144k - factory layout would break' % size)
                  sys.exit(1)
          PY
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: |
          df -hT
          free -h
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -20 || true

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/* 2>/dev/null || cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v5
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ZWRT_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "ZWRT JDCloud RE-SS-01 firmware" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old Releases
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the 3 newest releases; delete older ones and their tags.
          # gh CLI replaces dev-drprasad/delete-older-releases@master,
          # which runs on node20 and warned on every build.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[3:] | .[] | .tag_name' |
            while read -r tag; do
              [ -n "$tag" ] || continue
              gh release delete "$tag" --yes --cleanup-tag || true
            done
